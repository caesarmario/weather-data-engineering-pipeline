version: '3'

services:
  airflow:
    build:
      context: .
      dockerfile: ${PWD}/docker/Dockerfile
    env_file:
      - ${PWD}/docker/.env
    environment:
      - AIRFLOW__CORE__AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASS}@${AIRFLOW_DB_HOST}:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/opt/project
    volumes:
      - ${PWD}/airflow/dags:/opt/airflow/dags
      - ${PWD}/airflow/logs:/opt/airflow/logs
      - ${PWD}/airflow/plugins:/opt/airflow/plugins
      - ${PWD}/:/opt/project:delegated
      - ${PWD}/scripts/dbt:/dbt
    working_dir: /opt/project
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
    command: ["bash","-c","exec airflow standalone"]

  postgres:
    image: postgres:latest
    env_file:
      - ${PWD}/docker/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT}:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_DRIVER_PORT}:9000"
    depends_on:
      - minio
      - postgres

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - ${PWD}/docker/.env
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/data

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.6.0
    container_name: dbt
    volumes:
      - ${PWD}/scripts/dbt:/dbt
    working_dir: /dbt
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      - postgres

  dbt_clickhouse:
    image: python:3.10-slim
    container_name: dbt_clickhouse
    working_dir: /dbt
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      - clickhouse
    volumes:
      - ${PWD}/scripts/dbt:/dbt
    environment:
      - DBT_PROFILES_DIR=/dbt
    command: bash -c "pip install 'dbt-core==1.6.0' 'dbt-clickhouse==1.6.4' && tail -f /dev/null"
  
  adminer:
    image: adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - postgres

  greatexpectations:
    image: python:3.10
    container_name: great_expectations
    volumes:
      - ${PWD}/great_expectations:/app
    working_dir: /app
    entrypoint: ["bash", "-c", "pip install 'great_expectations==1.5.2' 'clickhouse-connect==0.7.*' 'SQLAlchemy==1.4.*' && tail -f /dev/null"]
    depends_on:
      - postgres
    command: tail -f /dev/null

  metabase:
    image: metabase/metabase
    container_name: metabase_weather
    ports:
      - "${METABASE_PORT}:3000"
    volumes:
      - ./metabase/plugins:/plugins
    environment:
      - MB_PLUGINS_DIR=/plugins
      - MB_DB_TYPE=${METABASE_DB_TYPE}
      - MB_DB_DBNAME=${METABASE_DB_DBNAME}
      - MB_DB_PORT=${METABASE_DB_PORT}
      - MB_DB_USER=${METABASE_DB_USER}
      - MB_DB_PASS=${METABASE_DB_PASS}
      - MB_DB_HOST=${METABASE_DB_HOST}
    depends_on:
      - postgres
      - clickhouse

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
