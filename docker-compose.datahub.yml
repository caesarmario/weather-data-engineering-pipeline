version: "3.8"

networks:
  data-platform: {}

volumes:
  datahub-mysql: {}
  datahub-es: {}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [data-platform]

  broker:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks: [data-platform]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on: [broker]
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks: [data-platform]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - datahub-es:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks: [data-platform]

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
    command: ["mysqld","--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - datahub-mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks: [data-platform]

  kafka-setup:
    image: acryldata/datahub-kafka-setup:latest
    depends_on: [broker, schema-registry]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks: [data-platform]

  datahub-gms:
    image: acryldata/datahub-gms:latest
    depends_on: [mysql, broker, schema-registry, elasticsearch, kafka-setup]
    environment:
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_HOST: mysql
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      DATAHUB_ANALYTICS_ENABLED: "true"
    ports:
      - "8080:8080"
    networks: [data-platform]

  datahub-frontend:
    image: acryldata/datahub-frontend-react:latest
    depends_on: [datahub-gms]
    environment:
      DATAHUB_GMS_PROTOCOL: http
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
    ports:
      - "9002:9002"
    networks: [data-platform]

  datahub-actions:
    image: acryldata/datahub-actions:latest
    depends_on: [datahub-gms]
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
    networks: [data-platform]
